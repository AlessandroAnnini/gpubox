[project]
name = "gpubox"
version = "0.1.0"
description = "Rent one GPU box, wait until SSH works, run a command, copy a file, destroy it."
readme = "README.md"
authors = [
    { name = "Prime", email = "agentic-loop-prime@local" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2",
]

[project.optional-dependencies]
vast = ["vastai>=1.7"]
runpod = []
all = ["gpubox[vast,runpod]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpubox"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
]
