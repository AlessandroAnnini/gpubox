[project]
name = "gpubox"
dynamic = ["version"]
description = "Rent one GPU box, wait until SSH works, run a command, copy a file, destroy it."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Alessandro Annini", email = "alessandro.annini@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2",
]

[project.scripts]
gpubox = "gpubox._cli:main"

[project.optional-dependencies]
vast = ["vastai>=1.7"]
runpod = []
lambda = []
all = ["gpubox[vast,runpod,lambda]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\d+\\.\\d+\\.\\d+)"

[tool.hatch.build.targets.wheel]
packages = ["src/gpubox"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
]
